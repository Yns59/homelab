# Fichier : ansible.cfg
# À placer à la racine de ton projet Ansible

[defaults]

# Fichier d'inventaire chargé automatiquement
inventory = ./inventory/inventory.ini



# Utilisateur SSH par défaut sur les VM
remote_user = younes

# Clé privée utilisée pour la connexion SSH
private_key_file = ~/.ssh/id_ed25519

# Désactive la vérification de l'empreinte SSH
# Pratique en environnement de lab/test
host_key_checking = False

# Empêche la création des fichiers .retry
retry_files_enabled = False

# Resultat YAML plus lisible
stdout_callback = ansible.builtin.default
callback_result_format = yaml


[privilege_escalation]

# Active sudo automatiquement
become = True

# Méthode d'élévation de privilèges
become_method = sudo

# Utilisateur cible pour l'élévation
become_user = root

