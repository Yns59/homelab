- name: deploiment du conteneur d'administration /opt/portainer
  hosts: docker
  become: true

  tasks:
  - name: creation du volume Docker persistant pour les données de Portainer
    community.docker.docker_volume:
      name: portainer_data
      state: present

  - name: lancement du conteneur portainer avec redémarrage auto
    community.docker.docker_container:
      name: portainer
      image: portainer/portainer-ce:latest
      state: started
      restart_policy: always
      published_ports:
      - "8000:8000"
      - "9443:9443"

      volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
